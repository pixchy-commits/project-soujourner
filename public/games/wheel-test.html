<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sojourner Sol 4 — Soil Detective (prototype) (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#c4612f;overflow:hidden;font-family:'Nunito',system-ui,sans-serif;color:#fff4e2;-webkit-user-select:none;user-select:none}
#fit{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:#c4612f}
#stage{position:relative;width:1440px;height:900px;overflow:hidden;transform-origin:center center;flex:none}
.abs{position:absolute}
.fred{font-family:'Fredoka',sans-serif;font-weight:600}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:4px solid #f2c14e;outline-offset:3px}

/* ground */
.mars{background:radial-gradient(ellipse 55% 40% at 18% 28%,rgba(255,196,150,.35),transparent 70%),radial-gradient(ellipse 50% 35% at 82% 78%,rgba(110,36,12,.35),transparent 70%),radial-gradient(circle at 72% 18%,rgba(255,214,176,.22),transparent 40%),linear-gradient(160deg,#d9783f 0%,#c4612f 48%,#a54a22 100%)}
.speck{background-image:radial-gradient(rgba(90,30,10,.22) 1.5px,transparent 2px),radial-gradient(rgba(255,222,190,.2) 1px,transparent 1.6px);background-size:38px 38px,23px 23px;background-position:0 0,11px 7px}
.vign{background:radial-gradient(ellipse at 45% 50%,rgba(255,214,170,.08) 0%,rgba(90,30,10,.22) 72%,rgba(60,18,6,.42) 100%)}
/* Full-viewport Mars terrain, while the 1440x900 game UI scales uniformly.
   This removes the solid side bars without stretching or cropping controls. */
#fit{background:radial-gradient(ellipse 55% 40% at 18% 28%,rgba(255,196,150,.35),transparent 70%),radial-gradient(ellipse 50% 35% at 82% 78%,rgba(110,36,12,.35),transparent 70%),radial-gradient(circle at 72% 18%,rgba(255,214,176,.22),transparent 40%),linear-gradient(160deg,#d9783f 0%,#c4612f 48%,#a54a22 100%)}
#fit::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(90,30,10,.22) 1.5px,transparent 2px),radial-gradient(rgba(255,222,190,.2) 1px,transparent 1.6px);background-size:38px 38px,23px 23px;background-position:0 0,11px 7px}
#fit::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 45% 50%,rgba(255,214,170,.08) 0%,rgba(90,30,10,.22) 72%,rgba(60,18,6,.42) 100%)}
#stage{z-index:1}
#stage>.mars,#stage>.speck,#stage>.vign{background:none}

.t-sand{background-color:#ebb57d;background-image:radial-gradient(rgba(255,244,222,.8) 1.2px,transparent 1.7px),radial-gradient(rgba(170,86,34,.4) 1px,transparent 1.5px),radial-gradient(ellipse 40% 12% at 50% 50%,rgba(255,240,215,.35),transparent 70%);background-size:9px 9px,13px 13px,90px 34px;background-position:0 0,4px 6px,0 0}
.t-firm{background-color:#b8653b;background-image:linear-gradient(90deg,rgba(74,26,9,.28) 2px,transparent 2px),linear-gradient(0deg,rgba(74,26,9,.28) 2px,transparent 2px),linear-gradient(90deg,rgba(255,226,196,.12) 50%,transparent 50%);background-size:52px 30px,52px 30px,104px 60px;background-position:0 0,26px 0,0 0}
.t-rock{background-color:#9a4a2b;background-image:radial-gradient(circle at 30% 35%,#6a2e1c 0 7px,rgba(255,214,186,.35) 7px 8.5px,transparent 9px),radial-gradient(circle at 70% 70%,#7a3824 0 5px,transparent 6px),radial-gradient(circle at 50% 50%,#5e2818 0 3px,transparent 4px);background-size:44px 44px,30px 30px,17px 17px;background-position:0 0,9px 13px,4px 2px}

/* components */
.round{width:52px;height:52px;border-radius:50%;background:rgba(22,28,44,.82);border:2px solid rgba(255,240,220,.35);display:grid;place-items:center;box-shadow:0 6px 16px rgba(60,18,6,.35)}
.pill{height:52px;padding:0 20px;border-radius:26px;background:rgba(22,28,44,.82);border:2px solid rgba(255,240,220,.35);display:flex;align-items:center;gap:14px;box-shadow:0 6px 16px rgba(60,18,6,.35)}
.panel{border-radius:36px;background:rgba(22,28,44,.9);border:2px solid rgba(255,240,220,.28);box-shadow:0 30px 60px rgba(40,12,4,.45)}
.card{border-radius:40px;background:#fff4e2;color:#1c2438;box-shadow:0 30px 70px rgba(40,12,4,.5)}
.chip{height:56px;padding:0 22px;border-radius:28px;background:#fff4e2;color:#1c2438;display:flex;align-items:center;gap:12px;box-shadow:0 8px 20px rgba(60,18,6,.35);font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px}
.btn{height:76px;padding:0 34px;border-radius:38px;background:linear-gradient(#e8793a,#c95a24);color:#fff9ee;box-shadow:0 6px 0 #8a3a14;display:flex;align-items:center;justify-content:center;gap:12px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:27px;transition:transform .12s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8a3a14}
.btn[disabled]{background:rgba(22,28,44,.6);color:rgba(255,244,226,.7);box-shadow:none;border:2px dashed rgba(255,240,220,.5);cursor:default}
.ghost{height:72px;padding:0 26px;border-radius:36px;border:3px solid currentColor;display:flex;align-items:center;gap:10px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px}
.dim{position:absolute;inset:0;background:rgba(40,12,4,.55)}

/* animations */
@keyframes ring{50%{transform:scale(.9);opacity:.6}}
.pulse{animation:ring 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.bob{animation:bob 1.3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.orbit{animation:spin 2.4s linear infinite}
@keyframes fillring{from{stroke-dashoffset:942.5}to{stroke-dashoffset:0}}
.fillring{animation:fillring 7.2s linear infinite}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
.pop{animation:pop .45s ease-out both}
@keyframes fadeup{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.fadeup{animation:fadeup .4s ease-out both}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.shake{animation:shake .4s}
@keyframes warn{50%{transform:scale(1.15)}}
.warn{animation:warn 1s ease-in-out infinite}
.screen-in{animation:fadeup .3s ease-out both}
#fx .p{position:absolute;border-radius:50%;pointer-events:none}
</style>
</head>
<body>
<div id="fit">
<div id="stage">
  <div class="abs mars" style="inset:0"></div>
  <div class="abs speck" style="inset:0"></div>
  <div class="abs vign" style="inset:0"></div>

  <div id="screen" class="abs" style="inset:0"></div>
  <div id="overlay" class="abs" style="inset:0;pointer-events:none"></div>

  <!-- chrome -->
  <div class="abs" style="left:32px;top:24px;display:flex;gap:12px;z-index:20">
    <button class="round" id="homeBtn" aria-label="Start over"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff4e2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg></button>
    <div class="pill"><span class="fred" style="font-size:21px">Sol 4 · Soil Detective</span><span id="pips" style="display:flex;gap:6px"></span></div>
  </div>
  <div class="abs" style="right:32px;top:24px;display:flex;gap:12px;z-index:20">
    <button class="round" id="soundBtn" aria-label="Sound on"></button>
    <button class="round" id="setBtn" aria-label="Tester tools"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff4e2" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M5.2 18.8l2.1-2.1M16.7 7.3l2.1-2.1"/></svg></button>
  </div>
  <div id="tools" class="abs panel" style="right:32px;top:90px;width:300px;padding:18px;z-index:30;display:none;flex-direction:column;gap:10px">
    <div class="fred" style="font-size:20px">Tester tools</div>
    <button class="ghost" style="height:52px;font-size:18px" data-tool="skip">Skip to analysis</button>
    <button class="ghost" style="height:52px;font-size:18px" data-tool="easy">Half spins (testing)</button>
    <button class="ghost" style="height:52px;font-size:18px" data-tool="reset">Restart game</button>
  </div>
</div>
</div>

<script>
function notifyHost(type, detail = {}) {
  if (window.parent !== window) window.parent.postMessage({ source: 'sojourner-wheel-test', type, ...detail }, window.location.origin);
}
/* =========================================================
   CONFIG — balancing values (provisional, tune after playtests)
   ========================================================= */
const SITES = {
  A: { name:'Site A', cls:'t-sand', stars:1, label:'Easy',   spins:3, time:35,
       patch:{x:170,y:470,w:300,h:210}, stop:{x:262,y:517}, fx:'dust',
       soil:'Loose sand', dist:90,  obs:'The wheel spins but barely moves!' },
  B: { name:'Site B', cls:'t-firm', stars:2, label:'Medium', spins:5, time:30,
       patch:{x:640,y:580,w:320,h:200}, stop:{x:742,y:622}, fx:'few',
       soil:'Firm ground', dist:600, obs:'The wheel grips and moves forward!' },
  C: { name:'Site C', cls:'t-rock', stars:3, label:'Hard',   spins:8, time:25,
       patch:{x:1010,y:250,w:300,h:220}, stop:{x:1102,y:302}, fx:'rock',
       soil:'Rocky ground', dist:330, obs:'The wheel bumps against rocks!' }
};
const WHEELS = 6;
const QUESTIONS = [
  { q:'Which ground made the wheel slip the most?', ans:'A',
    hint:'Look at how far each wheel moved. Which one travelled the least?',
    yes:'Yes! Site A is loose sand.', why:'Loose sand moves under the wheel, so it is hard to grip.' },
  { q:'Which ground helped the wheel travel the farthest?', ans:'B',
    hint:'Look for the wheel that ended up farthest from the yellow start line.',
    yes:'Yes! Site B is firm ground.', why:'Firm ground helps the wheel grip, so it moves farther.' },
  { q:'Which ground scratched the wheel?', ans:'C',
    hint:'Look for bumps and the magnifying glass.',
    yes:'Yes! Site C is rocky ground.', why:'Rough rocks make the ride bumpy and scratch the wheel.' }
];

/* =========================================================
   STATE
   ========================================================= */
let S;
function freshState(){
  return {
    sites:{ A:{wheels:Array(6).fill(0),done:false}, B:{wheels:Array(6).fill(0),done:false}, C:{wheels:Array(6).fill(0),done:false} },
    cur:null, timeLeft:0, rover:{x:620,y:300,r:-121}, q:0, qSolved:false, routeDone:false, spinScale:1
  };
}
S = freshState();
let sound = true, actx = null;
const stage = document.getElementById('stage');
const screen = document.getElementById('screen');
const overlay = document.getElementById('overlay');
const $ = sel => stage.querySelector(sel);
const $$ = sel => [...stage.querySelectorAll(sel)];

/* fit 1440x900 to window */
function fit(){ const scale = Math.min(innerWidth / 1440, innerHeight / 900); stage.style.transform = `scale(${scale})`; }
addEventListener('resize', fit); fit();

/* =========================================================
   ART
   ========================================================= */
const ROVER = `<svg width="100%" height="100%" viewBox="0 0 100 100" style="filter:drop-shadow(2px 7px 5px rgba(60,18,6,.45))" aria-hidden="true"><path d="M50 -1 L63 13 H37Z" fill="#f2c14e" stroke="#1c2438" stroke-width="3" stroke-linejoin="round"/><g fill="#d27a36" stroke="#3a1a10" stroke-width="2.5"><rect x="10" y="20" width="13" height="17" rx="6"/><rect x="10" y="43" width="13" height="17" rx="6"/><rect x="10" y="66" width="13" height="17" rx="6"/><rect x="77" y="20" width="13" height="17" rx="6"/><rect x="77" y="43" width="13" height="17" rx="6"/><rect x="77" y="66" width="13" height="17" rx="6"/></g><rect x="23" y="22" width="54" height="62" rx="12" fill="#f3e8d0" stroke="#3a1a10" stroke-width="2.8"/><rect x="20" y="30" width="60" height="42" rx="9" fill="#2c3f6b" stroke="#3a1a10" stroke-width="2.5"/><g stroke="rgba(200,220,255,.4)" stroke-width="1.4" stroke-linecap="round"><line x1="35" y1="33" x2="35" y2="69"/><line x1="50" y1="33" x2="50" y2="69"/><line x1="65" y1="33" x2="65" y2="69"/><line x1="23" y1="51" x2="77" y2="51"/></g><rect x="33" y="13" width="34" height="12" rx="6" fill="#f3e8d0" stroke="#3a1a10" stroke-width="2.5"/><circle cx="43" cy="19" r="3.6" fill="#3a2414"/><circle cx="57" cy="19" r="3.6" fill="#3a2414"/><circle cx="44" cy="18" r="1.2" fill="#fff"/><circle cx="58" cy="18" r="1.2" fill="#fff"/></svg>`;
const WHEEL = (scratched) => `<svg width="100%" height="100%" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="92" fill="#4a5468" stroke="#1c2438" stroke-width="5"/><circle cx="100" cy="100" r="86" fill="none" stroke="#c9ced6" stroke-width="12" stroke-dasharray="12 21.77"/><circle cx="100" cy="100" r="74" fill="#b9c0cc" stroke="#1c2438" stroke-width="4"/><g stroke="#6b7488" stroke-width="7" stroke-linecap="round"><line x1="100" y1="34" x2="100" y2="166"/><line x1="43" y1="67" x2="157" y2="133"/><line x1="43" y1="133" x2="157" y2="67"/></g><circle cx="100" cy="100" r="26" fill="#2c3f6b" stroke="#1c2438" stroke-width="4"/><circle cx="100" cy="100" r="9" fill="#f2c14e"/>${scratched?'<g stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"><path d="M150 40 l12 10 -6 2 10 10"/><path d="M168 120 l10 -8 0 8 10 -6"/></g>':''}</svg>`;
const STAR = (on) => `<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17l-5.9 3.3 1.3-6.6L2.5 9.1l6.6-.8z" fill="${on?'#f2c14e':'none'}" stroke="${on?'#1c2438':'#a39472'}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
const I = {
  play:'<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z" fill="currentColor"/></svg>',
  check:(c='currentColor',w=26)=>`<svg width="${w}" height="${w}" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="${c}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  replay:(c='currentColor')=>`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>`,
  next:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  back:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  clock:(c='#1c2438')=>`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>`,
  mag:(c='currentColor')=>`<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="${c}" stroke-width="2.6"/><path d="M15 15l5.5 5.5" stroke="${c}" stroke-width="3" stroke-linecap="round"/></svg>`,
  lock:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  cursor:(f='#fff4e2')=>`<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l13 7-5.5 1.8L11 18z" fill="${f}" stroke="#1c2438" stroke-width="1.6" stroke-linejoin="round"/></svg>`,
  map:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>',
  slip:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1c2438" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>',
  go:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1c2438" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h16"/><path d="M13 6l6 6-6 6"/></svg>',
  bump:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1c2438" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 17 Q6 7 10 17 Q14 7 18 17 Q20 12 22 17"/></svg>'
};
const SOIL_ICON = { A:['#f2c14e',I.slip], B:['#7fd6cc',I.go], C:['#e8793a',I.bump] };

/* =========================================================
   SOUND (simple synth, optional)
   ========================================================= */
function audioInit(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function beep(freq, dur=0.09, type='sine', vol=0.12){
  if(!sound || !actx) return;
  try{ const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.value=freq; g.gain.value=vol;
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+dur); }catch(e){}
}
const chime = () => { beep(660,.12); setTimeout(()=>beep(880,.12),90); setTimeout(()=>beep(1175,.2),180); };
function drawSound(){
  $('#soundBtn').innerHTML = sound
    ? '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff4e2" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>'
    : '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff4e2" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/><path d="M3 3l18 18"/></svg>';
  $('#soundBtn').setAttribute('aria-label', sound?'Sound on':'Sound off');
  $('#soundBtn').style.background = sound ? 'rgba(22,28,44,.82)' : '#3b1d14';
}
$('#soundBtn').onclick = () => { audioInit(); sound = !sound; drawSound(); };
drawSound();
stage.addEventListener('pointerdown', audioInit, {once:true});

/* =========================================================
   CHROME
   ========================================================= */
function setStage(n){ $('#pips').innerHTML = [0,1,2,3,4,5].map(i=>`<span style="width:12px;height:12px;border-radius:50%;${i<n?'background:#7fd6cc':i===n?'background:#fff4e2;box-shadow:0 0 0 3px rgba(255,244,226,.35)':'background:rgba(255,240,220,.25)'}"></span>`).join(''); }
function render(html, stageNum){ stopSpin(); overlay.innerHTML=''; overlay.style.pointerEvents='none'; screen.innerHTML = `<div class="abs screen-in" style="inset:0">${html}</div>`; if(stageNum!==undefined) setStage(stageNum); }
function showOverlay(html){ overlay.innerHTML = `<div class="dim"></div>${html}`; overlay.style.pointerEvents='auto'; }
$('#homeBtn').onclick = () => { stopTimer(); S = freshState(); intro(); notifyHost('home'); };
$('#setBtn').onclick = () => { const t=$('#tools'); t.style.display = t.style.display==='flex'?'none':'flex'; };
$$('[data-tool]').forEach(b => b.onclick = () => {
  const t=b.dataset.tool; $('#tools').style.display='none';
  if(t==='skip'){ stopTimer(); for(const k in S.sites){ S.sites[k].done=true; S.sites[k].wheels=Array(6).fill(1e9);} S.rover={...SITES.C.stop,r:0}; map(); }
  if(t==='easy'){ S.spinScale = S.spinScale===1?0.5:1; b.textContent = S.spinScale===1?'Half spins (testing)':'Normal spins'; }
  if(t==='reset'){ stopTimer(); S=freshState(); intro(); }
});

/* =========================================================
   1 · INTRO
   ========================================================= */
function intro(){
  render(`
    <div class="abs t-sand" style="left:90px;top:560px;width:230px;height:150px;border-radius:50%;opacity:.85;box-shadow:inset 0 0 0 4px rgba(255,244,226,.4)"></div>
    <div class="abs t-firm" style="left:330px;top:640px;width:240px;height:150px;border-radius:50%;opacity:.85;box-shadow:inset 0 0 0 4px rgba(255,244,226,.4)"></div>
    <div class="abs t-rock" style="left:470px;top:470px;width:200px;height:140px;border-radius:50%;opacity:.85;box-shadow:inset 0 0 0 4px rgba(255,244,226,.4)"></div>
    ${[[180,590],[430,676],[560,500]].map(([x,y])=>`<div class="abs fred" style="left:${x}px;top:${y}px;width:52px;height:52px;border-radius:50%;background:#1c2438;display:grid;place-items:center;font-size:28px;font-weight:700">?</div>`).join('')}
    <div class="abs bob" style="left:190px;top:230px;width:300px;height:300px;transform:rotate(-8deg)">${ROVER}</div>
    <section class="abs panel" style="left:720px;top:150px;width:640px;padding:40px 44px">

function travel(id){
  $$('[data-site]').forEach(b=>b.disabled=true);

/* =========================================================
   TIMER — one loop for the whole six-wheel experiment
   ========================================================= */
const timer = { running:false, raf:0, last:0 };
function startTimer(){ stopTimer(); timer.running = true; timer.last = performance.now(); timer.raf = requestAnimationFrame(tick); }
function stopTimer(){ timer.running = false; cancelAnimationFrame(timer.raf); }
let lastWhole = null;
function tick(t){
  if(!timer.running) return;
  const dt = Math.min(0.25, (t - timer.last)/1000); timer.last = t;
  S.timeLeft = Math.max(0, S.timeLeft - dt);
  updateHud();
  const whole = Math.ceil(S.timeLeft);
  if(whole !== lastWhole && whole <= 5 && whole > 0) beep(520,.06,'square',.05);
  lastWhole = whole;
  if(S.timeLeft <= 0){ stopTimer(); timeUp(); return; }
  timer.raf = requestAnimationFrame(tick);
}
function wheelsDone(){ const st=S.sites[S.cur], n=need(S.cur)*360; return st.wheels.filter(d=>d>=n).length; }
function hud(){
  const c=SITES[S.cur];
  return `
  <div class="abs chip" style="left:32px;top:92px;height:52px;font-size:20px;padding:0 18px 0 6px">
    <span class="${c.cls}" style="width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(28,36,56,.25)"></span>${c.name}<span style="display:flex">${[0,1,2].map(i=>i<c.stars?STAR(true):'').join('')}</span>
  </div>
  <div class="abs pill" role="timer" style="left:470px;top:24px;width:500px;height:64px;padding:0 10px 0 8px;gap:12px;z-index:5">
    <span id="hClock" style="flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#f2c14e">${I.clock()}</span>
    <span id="hTime" class="fred" style="font-weight:700;min-width:54px;text-align:center;font-size:30px"></span>
    <span style="flex:1;height:16px;border-radius:8px;background:rgba(255,240,220,.18);overflow:hidden"><span id="hBar" style="display:block;height:100%;border-radius:8px"></span></span>
    <span class="fred" style="height:48px;padding:0 14px;border-radius:24px;background:#fff4e2;color:#1c2438;display:flex;align-items:center;gap:8px;font-size:20px">
      <span style="width:24px;height:24px">${WHEEL()}</span><span id="hCount"></span> / 6</span>
  </div>`;
}
function updateHud(){
  const t=$('#hTime'); if(!t) return;
  const c=SITES[S.cur], warn = S.timeLeft <= 5;
  t.textContent = Math.ceil(S.timeLeft);
  t.style.color = warn ? '#ffb48a' : '#fff4e2';
  t.classList.toggle('warn', warn && S.timeLeft>0);
  $('#hClock').style.background = warn ? '#e8793a' : '#f2c14e';
  const bar=$('#hBar'); bar.style.width = (S.timeLeft/c.time*100)+'%'; bar.style.background = warn ? '#e8793a' : '#7fd6cc';
  $('#hCount').textContent = wheelsDone();
}

  `, 2);

  const zone=$('#zone'), wheelWrap=$('#wheelWrap'), wheelEl=$('#wheel'), ring=$('#ring');
  let active=false, prev=null, run=0, credited=false, rot=st.wheels[i], lastSpin=Math.floor(st.wheels[i]/360), finished=false, fxAcc=0;
  const C=1570.8;
  function draw(){
    const d=Math.min(st.wheels[i], target);
    wheelEl.style.transform = `rotate(${rot}deg)`;
    ring.style.strokeDashoffset = C*(1-d/target);

  }
  draw();
  function angleOf(ev){
    const r = wheelWrap.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
    const dx=ev.clientX-cx, dy=ev.clientY-cy;
    if(Math.hypot(dx,dy) < r.width*0.1) return null;          // unstable near centre
    return Math.atan2(dy,dx)*180/Math.PI;
  }
  function add(deg){
    st.wheels[i] = Math.min(target, st.wheels[i] + deg);
    fxAcc += deg; while(fxAcc > 14){ fxAcc -= 14; particle(); }

    if(st.wheels[i] >= target && !finished){ finished=true; complete(); }
  }
  function step(ev){
    const a = angleOf(ev);
    if(a===null){ prev=null; return; }
    if(prev===null){ prev=a; return; }
    let d=a-prev; while(d>180)d-=360; while(d<-180)d+=360; prev=a;
    if(Math.abs(d) > 100) return;                               // jump across centre / glitch
    rot += d;
    // filter tiny back-and-forth wiggles: a run only counts once it passes 25°
    if(run!==0 && Math.sign(d)!==Math.sign(run)){ run=0; credited=false; }
    run += d;
    if(!credited){ if(Math.abs(run) >= 25){ credited=true; add(Math.abs(run)); } }
    else add(Math.abs(d));
  }
  const down = e => { if(finished || !timer.running) return; active=true; prev=angleOf(e); run=0; credited=false; try{zone.setPointerCapture(e.pointerId);}catch(_){} zone.style.cursor='grabbing'; $('#arrows').style.opacity=.35; e.preventDefault(); };
  const move = e => { if(!active || finished) return; const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : []; (evs.length?evs:[e]).forEach(step); draw(); };
  const up = () => { active=false; prev=null; zone.style.cursor='grab'; const a=$('#arrows'); if(a) a.style.opacity=1; };

    fx.appendChild(p);

  }
  function complete(){
    active=false; draw(); chime();
    $('#arrows').style.opacity=0;
    $('#burst').innerHTML = `<svg class="abs pop" width="700" height="700" viewBox="0 0 700 700" style="left:370px;top:120px"><g stroke="#f2c14e" stroke-width="12" stroke-linecap="round"><line x1="350" y1="20" x2="350" y2="60"/><line x1="350" y1="640" x2="350" y2="680"/><line x1="20" y1="350" x2="60" y2="350"/><line x1="640" y1="350" x2="680" y2="350"/><line x1="117" y1="117" x2="145" y2="145"/><line x1="583" y1="117" x2="555" y2="145"/><line x1="117" y1="583" x2="145" y2="555"/><line x1="583" y1="583" x2="555" y2="555"/></g></svg>

function playLane(lane, instant){

  $$('.lane').forEach(l=>playLane(l,true));
  $('#watch').onclick = () => $$('.lane').forEach(l=>playLane(l));
  $$('.qcard').forEach(b => b.onclick = () => answer(b));
}
function answer(b){
  if(S.qSolved) return;
  const Q = QUESTIONS[S.q], id = b.dataset.a, fb = $('#fb');
  if(id === Q.ans){
    S.qSolved = true; chime();
    b.style.borderColor='#3fb8a9'; b.style.transform='translateY(-8px)';
    $$('.qcard').forEach(o=>{ if(o!==b) o.style.opacity=.7; });
    b.querySelector('.tag').innerHTML = `<span class="fred pop" style="height:48px;padding:0 18px 0 8px;border-radius:24px;background:#3fb8a9;color:#fff;display:flex;align-items:center;gap:8px;font-size:22px"><span style="width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center">${I.check('#23796f',20)}</span>${SITES[id].soil}</span>`;
    const last = S.q === QUESTIONS.length-1;
    fb.innerHTML = `<div class="pop" style="height:140px;padding:0 22px 0 26px;border-radius:32px;background:#fff4e2;color:#1c2438;display:flex;align-items:center;gap:22px;box-shadow:0 20px 40px rgba(40,12,4,.4);border:5px solid #3fb8a9">
      <div style="flex:none;width:92px;height:92px;border-radius:50%;background:#3fb8a9;display:grid;place-items:center">${I.check('#fff',54)}</div>
      <div style="flex:1"><div class="fred" style="font-weight:700;font-size:32px">${Q.yes}</div><div style="font-size:22px;font-weight:800;color:#4a3d28;margin-top:2px">${Q.why}</div></div>
      <button class="btn" id="nextQ" style="flex:none">${last?'See what we found':'Next clue'} ${I.next}</button></div>`;
    $('#nextQ').onclick = () => { if(last) summary(); else { S.q++; question(); } };
  } else {
    beep(220,.18,'triangle',.08);
    b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
    fb.innerHTML = `<div class="fadeup" style="height:110px;padding:0 26px;border-radius:32px;background:rgba(22,28,44,.92);border:3px solid #f2c14e;display:flex;align-items:center;gap:20px">
      <span style="flex:none;width:64px;height:64px;border-radius:50%;background:#f2c14e;display:grid;place-items:center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1c2438" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></span>
      <span class="fred" style="font-size:27px">Not quite. ${Q.hint}</span></div>`;
  }
}

/* =========================================================
   12 · SUMMARY
   ========================================================= */
function summary(){
  const R = { A:'The wheels slipped.', B:'The wheels gripped well.', C:'The wheels bumped and got scratched.' };
  render(`
    <h1 class="abs fred" style="left:60px;top:100px;margin:0;font-weight:700;font-size:48px;text-shadow:0 3px 10px rgba(60,18,6,.4)">You found 3 kinds of ground!</h1>
    <div class="abs" style="left:60px;top:196px;width:1320px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px">
      ${['A','B','C'].map((id,k)=>`
        <article class="fadeup" style="animation-delay:${k*.15}s;height:520px;padding:20px;border-radius:34px;background:#fff4e2;color:#1c2438;box-shadow:0 20px 40px rgba(40,12,4,.4);display:flex;flex-direction:column">
          ${laneTrack(id,{w:376,h:230,wheel:90,start:56,ground:64,scale:0.42})}
          <div style="margin-top:20px;display:flex;align-items:center;gap:12px"><span class="${SITES[id].cls}" style="width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(28,36,56,.3)"></span><span class="fred" style="font-weight:700;font-size:34px">${SITES[id].soil}</span></div>
          <div style="font-weight:800;font-size:17px;color:#6b5a3a;margin-top:4px">${SITES[id].name}</div>
          <div style="margin-top:auto;padding:16px 18px;border-radius:22px;background:#efe2c6;display:flex;align-items:center;gap:14px">
            <span style="flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:${SOIL_ICON[id][0]}">${SOIL_ICON[id][1]}</span>
            <span class="fred" style="font-size:23px;line-height:1.2">${R[id]}</span></div>
        </article>`).join('')}
    </div>
    <button class="abs btn" id="toRoute" style="right:60px;top:760px">Help Sojo pick a path ${I.next}</button>`, 5);
  $$('.lane').forEach(l=>playLane(l,true));
  $('#toRoute').onclick = route;
}

/* =========================================================
   13 · ROUTE DECISION
   ========================================================= */
function route(){
  const P = [{id:'A',x:60},{id:'C',x:290},{id:'B',x:520}];
  const WRONG = { A:'Sojo would slip in the loose sand. Try another path!', C:'Bumpy! The rocks would scratch Sojo’s wheels. Try another path!' };
  render(`
    <section class="abs" style="left:60px;top:100px;width:760px;height:760px;border-radius:36px;border:3px solid rgba(255,240,220,.55);background:rgba(70,24,8,.18);overflow:hidden">
      <div class="abs" style="left:320px;top:18px;width:116px;height:116px;display:grid;place-items:center">
        <div class="abs pulse" style="inset:14px;border-radius:50%;border:5px solid #fff4e2;box-shadow:0 0 22px rgba(255,240,210,.9)"></div>
        <svg class="bob" width="50" height="50" viewBox="0 0 24 24" style="position:relative"><path d="M6 22V2.5" stroke="#1c2438" stroke-width="2.4" stroke-linecap="round"/><path d="M6 3.5h12l-3 4.5 3 4.5H6" fill="#3fb8a9" stroke="#1c2438" stroke-width="2" stroke-linejoin="round"/></svg>
      </div>
      <div class="abs" style="left:140px;top:120px;width:480px;height:40px;border:6px dotted rgba(255,244,226,.55);border-bottom:0;border-radius:30px 30px 0 0"></div>
      <div class="abs" style="left:140px;top:600px;width:480px;height:40px;border:6px dotted rgba(255,244,226,.55);border-top:0;border-radius:0 0 30px 30px"></div>
      ${P.map((p,i)=>`<button class="abs ${SITES[p.id].cls} path" data-p="${p.id}" aria-label="Path ${i+1}" style="left:${p.x}px;top:160px;width:180px;height:440px;border-radius:40px;border:4px solid rgba(255,244,226,.5);transition:all .25s"></button>
        <div class="abs fred" style="left:${p.x+66}px;top:540px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:24px;background:#1c2438;pointer-events:none">${i+1}</div>`).join('')}
      <div id="rRover" class="abs" style="left:320px;top:640px;width:116px;height:116px;pointer-events:none">${ROVER}</div>
    </section>
    <section class="abs panel" style="left:860px;top:100px;width:520px;height:760px;padding:30px;display:flex;flex-direction:column">
      <h2 class="fred" style="margin:0;font-weight:700;font-size:36px;line-height:1.15">Which ground should Sojo drive on?</h2>
      <div style="margin-top:22px;display:flex;flex-direction:column;gap:14px">
        ${P.map((p,i)=>`<button class="opt" data-p="${p.id}" style="height:104px;padding:0 18px 0 14px;border-radius:28px;display:flex;align-items:center;gap:16px;background:rgba(255,240,220,.08);border:2px solid rgba(255,240,220,.3);transition:all .2s">
          <span class="${SITES[p.id].cls}" style="flex:none;width:70px;height:70px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(28,36,56,.3)"></span>
          <span style="flex:1;text-align:left"><span style="display:block;font-weight:800;font-size:16px;opacity:.75">Path ${i+1}</span><span class="fred" style="display:block;font-size:26px">${SITES[p.id].soil}</span></span>
          <span class="mark"></span></button>`).join('')}
      </div>
      <div id="rfb" style="margin-top:20px"></div>
      <button class="btn" id="finish" style="margin-top:auto;display:none">Finish mission ${I.next}</button>
    </section>`, 5);
  const pick = id => {
    if(S.routeDone) return;
    $$('.opt').forEach(o=>{ const on=o.dataset.p===id; o.style.background=on?'#fff4e2':'rgba(255,240,220,.08)'; o.style.color=on?'#1c2438':'#fff4e2'; o.style.borderColor=on?(id==='B'?'#3fb8a9':'#f2c14e'):'rgba(255,240,220,.3)'; o.querySelector('.mark').innerHTML=''; });
    $$('.path').forEach(p=>{ const on=p.dataset.p===id; p.style.borderColor=on?(id==='B'?'#7fd6cc':'#f2c14e'):'rgba(255,244,226,.5)'; p.style.borderWidth=on?'7px':'4px'; });
    if(id==='B'){
      S.routeDone = true; chime();
      $(`.opt[data-p="B"] .mark`).innerHTML = `<span style="width:46px;height:46px;border-radius:50%;background:#3fb8a9;display:grid;place-items:center">${I.check('#fff')}</span>`;
      $('#rfb').innerHTML = `<div class="pop" style="padding:18px 20px;border-radius:24px;background:#fff4e2;color:#1c2438;border:4px solid #3fb8a9"><div class="fred" style="font-weight:700;font-size:28px">Great pick!</div><div style="font-size:20px;font-weight:800;color:#4a3d28;margin-top:2px;line-height:1.3">Firm ground grips well and won’t scratch the wheels.</div></div>`;
      $('#rRover').animate([{transform:'translate(0,0)'},{transform:'translate(200px,-40px) rotate(30deg)',offset:.15},{transform:'translate(232px,-180px)',offset:.35},{transform:'translate(232px,-460px)',offset:.8},{transform:'translate(0px,-590px) rotate(0deg)'}],{duration:3200,easing:'ease-in-out',fill:'forwards'});
      setTimeout(()=>{ $('#finish').style.display='flex'; }, 2600);
    } else {
      beep(220,.18,'triangle',.08);
      const o=$(`.opt[data-p="${id}"]`); o.classList.remove('shake'); void o.offsetWidth; o.classList.add('shake');
      $('#rfb').innerHTML = `<div class="fadeup" style="padding:18px 20px;border-radius:24px;background:rgba(255,240,220,.1);border:3px solid #f2c14e"><div class="fred" style="font-size:24px;line-height:1.3">${WRONG[id]}</div></div>`;
    }
  };
  $$('[data-p]').forEach(b => b.onclick = () => pick(b.dataset.p));
  S.routeDone = false;
  $('#finish').onclick = complete;
}

/* =========================================================
   14 · MISSION COMPLETE
   ========================================================= */
function complete(){
  notifyHost('complete', { sitesTested: 3, wheelsTested: 18 });
  render(`<div class="abs" style="left:620px;top:380px;width:200px;height:200px;transform:rotate(-10deg)">${ROVER}</div>`, 6);
  chime(); setTimeout(chime,350);
  showOverlay(`
    <section class="abs card pop" style="left:380px;top:160px;width:680px;padding:96px 44px 36px;text-align:center">
      <div class="abs" style="left:270px;top:-86px;width:140px;height:170px">
        <div class="abs" style="left:30px;top:0;width:34px;height:70px;background:#3fb8a9;transform:skewX(14deg)"></div>
        <div class="abs" style="left:76px;top:0;width:34px;height:70px;background:#e8793a;transform:skewX(-14deg)"></div>
        <div class="abs" style="left:10px;top:40px;width:120px;height:120px;border-radius:50%;background:#f2c14e;border:6px solid #1c2438;display:grid;place-items:center;box-shadow:0 10px 20px rgba(40,12,4,.35)"><div style="width:66px;height:66px">${WHEEL()}</div></div>
      </div>
      <div class="fred" style="font-weight:700;font-size:46px">Mission accomplished!</div>
      <div style="font-size:24px;font-weight:800;margin-top:4px;color:#4a3d28">You are a Mars Soil Scientist!</div>
      <div style="margin-top:24px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px">
        ${[['3','sites explored','<svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 22s7-7.2 7-12.5A7 7 0 0 0 5 9.5C5 14.8 12 22 12 22z" fill="#e8793a" stroke="#1c2438" stroke-width="1.8"/><circle cx="12" cy="9.5" r="2.6" fill="#fff4e2"/></svg>'],
           ['18','wheels tested','<div style="width:30px;height:30px">'+WHEEL()+'</div>'],
           ['3','soil types found',I.mag('#1c2438')]].map(s=>`
          <div style="padding:14px 0;border-radius:22px;background:#efe2c6;display:flex;flex-direction:column;align-items:center;gap:2px">${s[2]}<span class="fred" style="font-weight:700;font-size:36px">${s[0]}</span><span style="font-weight:800;font-size:16px">${s[1]}</span></div>`).join('')}
      </div>
      <div style="margin-top:18px;display:flex;align-items:center;gap:16px;padding:14px 20px;border-radius:24px;background:#1c2438;color:#fff4e2;text-align:left">
        <svg width="76" height="60" viewBox="0 0 100 80"><ellipse cx="52" cy="70" rx="44" ry="8" fill="rgba(0,0,0,.3)"/><path d="M10 66 C6 40 26 14 52 12 C78 10 96 34 92 58 C90 70 76 72 52 72 C30 72 12 72 10 66Z" fill="#9a4a2b" stroke="#fff4e2" stroke-width="3"/><path d="M28 36 C36 24 48 20 60 22" fill="none" stroke="rgba(255,214,180,.6)" stroke-width="6" stroke-linecap="round"/></svg>
        <div style="flex:1"><div style="font-weight:800;font-size:16px;color:#f2c14e">Next mission</div><div class="fred" style="font-size:28px">Sol 5 — Explore Yogi</div></div>
      </div>
      <div style="display:flex;gap:12px;justify-content:center;margin-top:24px">
        <button class="ghost" id="again" style="height:64px;color:#1c2438">${I.replay()} Play again</button>
        <button class="btn" id="sol5" style="height:64px;font-size:21px">Next mission ${I.play}</button>
      </div>
      <div id="sol5note" style="margin-top:10px;font-weight:800;font-size:16px;color:#6b5a3a;min-height:20px"></div>
    </section>`);
  $('#again').onclick = () => { S = freshState(); intro(); };
  $('#sol5').onclick = () => { notifyHost('next'); $('#sol5note').textContent = 'Continue to the next mission in the full game.'; };
}

intro();
</script>
</body>
</html>
