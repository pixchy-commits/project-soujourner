<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sojo — Soil Mission Pop-ups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   DESIGN TOKENS — taken from Sol 4 · Soil Investigation
   ========================================================= */
:root{
  --navy:#1c2438; --navy-glass:rgba(22,28,44,.9); --navy-soft:#2c3f6b;
  --cream:#fff4e2; --cream-2:#efe2c6; --cream-3:#e3d2ae; --ink-2:#4a3d28; --ink-3:#6b5a3a;
  --sun:#f2c14e; --orange:#e8793a; --orange-dk:#c95a24; --orange-sh:#8a3a14;
  --teal:#3fb8a9; --teal-lt:#7fd6cc; --teal-sh:#23796f;
  --rust:#9a4a2b; --rock:#7a3b28; --mars:#c4612f;
  --line-light:rgba(255,240,220,.35);
  --display:'Fredoka',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
  --ease-pop:cubic-bezier(.2,1.3,.4,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:transparent;font-family:var(--body);color:#e9e6df;overflow:hidden}
button{font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:4px solid var(--sun);outline-offset:3px}

/* =========================================================
   PREVIEW CONTROL (outside the game — designer tool styling)
   ========================================================= */
.pv{height:68px;display:flex;align-items:center;gap:12px;padding:0 20px;background:#16181f;border-bottom:1px solid #2a2d38;font-size:13px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#c9ccd6;position:relative;z-index:10;overflow-x:auto;white-space:nowrap}
.pv-title{font-weight:700;color:#fff;font-size:14px;line-height:1.2}
.pv-title small{display:block;font-weight:500;color:#8a8fa0;font-size:11.5px}
.pv-seg{display:flex;background:#0e1016;border:1px solid #2a2d38;border-radius:10px;padding:3px;gap:2px}
.pv-seg button{border:0;background:transparent;color:#aeb2c0;padding:7px 11px;border-radius:7px;font-size:12.5px;font-weight:600;font-family:inherit;display:flex;align-items:center;gap:6px}
.pv-seg button b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;background:#2a2d38;color:#fff;font-size:11px}
.pv-seg button[aria-pressed="true"]{background:#2d3550;color:#fff}
.pv-seg button[aria-pressed="true"] b{background:var(--sun);color:#1c2438}
.pv-seg button:hover{color:#fff}
.pv label{display:flex;align-items:center;gap:7px;color:#aeb2c0;font-weight:600}
.pv select{background:#0e1016;color:#fff;border:1px solid #2a2d38;border-radius:8px;padding:7px 8px;font:inherit;font-weight:600}
.pv input[type=checkbox]{width:16px;height:16px;accent-color:var(--sun)}
.pv .sep{width:1px;height:30px;background:#2a2d38;flex:none}
.pv .ghost{border:1px solid #2a2d38;background:#0e1016;color:#fff;border-radius:8px;padding:7px 11px;font-size:12.5px;font-weight:600;font-family:inherit}
.pv .ghost:hover{border-color:#4a4f60}
.pv .dim{opacity:.4}

.stage{position:absolute;top:0;left:0;right:0;bottom:0;display:grid;place-items:center}
.frame-wrap{position:relative}
.frame{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0;overflow:hidden;border-radius:0;box-shadow:none;font-family:var(--body);color:var(--cream)}
.stage-caption{position:absolute;left:0;right:0;bottom:-30px;text-align:center;font:600 12px system-ui,sans-serif;color:#767b8c}

/* =========================================================
   GAME WORLD (background gameplay scene)
   ========================================================= */
.mars{background:radial-gradient(ellipse 55% 40% at 18% 28%,rgba(255,196,150,.35),transparent 70%),radial-gradient(ellipse 50% 35% at 82% 78%,rgba(110,36,12,.35),transparent 70%),radial-gradient(circle at 72% 18%,rgba(255,214,176,.22),transparent 40%),linear-gradient(160deg,#d9783f 0%,#c4612f 48%,#a54a22 100%)}
.speck{background-image:radial-gradient(rgba(90,30,10,.22) 1.5px,transparent 2px),radial-gradient(rgba(255,222,190,.2) 1px,transparent 1.6px);background-size:38px 38px,23px 23px;background-position:0 0,11px 7px}
.t-sand{background-color:#ebb57d;background-image:radial-gradient(rgba(255,244,222,.8) 1.2px,transparent 1.7px),radial-gradient(rgba(170,86,34,.4) 1px,transparent 1.5px);background-size:9px 9px,13px 13px;background-position:0 0,4px 6px}
.t-firm{background-color:#b8653b;background-image:linear-gradient(90deg,rgba(74,26,9,.28) 2px,transparent 2px),linear-gradient(0deg,rgba(74,26,9,.28) 2px,transparent 2px);background-size:52px 30px,52px 30px}
.t-rock{background-color:#9a4a2b;background-image:radial-gradient(circle at 30% 35%,#6a2e1c 0 7px,rgba(255,214,186,.35) 7px 8.5px,transparent 9px),radial-gradient(circle at 70% 70%,#7a3824 0 5px,transparent 6px);background-size:44px 44px,44px 44px}

.world{position:absolute;inset:0;transition:filter .45s ease}
.world.blurred{filter:blur(5px) saturate(.9)}
.abs{position:absolute}
.hud-btn{width:52px;height:52px;border-radius:50%;background:rgba(22,28,44,.82);border:2px solid var(--line-light);display:grid;place-items:center;color:var(--cream);box-shadow:0 6px 16px rgba(60,18,6,.35)}
.hud-pill{height:52px;padding:0 20px;border-radius:26px;background:rgba(22,28,44,.82);border:2px solid var(--line-light);display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:600;font-size:21px;box-shadow:0 6px 16px rgba(60,18,6,.35)}

.scrim{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(40,12,4,.38),rgba(30,8,2,.66));opacity:0;pointer-events:none;transition:opacity .35s ease}
.scrim.on{opacity:1;pointer-events:auto}

/* Gameplay placeholder chip (designer-side, shown after Start) */
.play-note{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:12px 12px 12px 20px;border-radius:16px;background:rgba(14,16,22,.88);border:2px dashed #5b6070;font:600 15px system-ui,sans-serif;color:#d6d9e3;opacity:0;pointer-events:none;transition:opacity .3s}
.play-note.on{opacity:1;pointer-events:auto}
.play-note button{border:0;border-radius:10px;padding:10px 14px;background:var(--sun);color:#1c2438;font:700 14px system-ui,sans-serif}

/* =========================================================
   POP-UP SYSTEM — shared shell
   ========================================================= */
.pop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;color:var(--navy);transition:opacity .3s ease,transform .45s var(--ease-pop)}
.pop.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.card{position:relative;background:var(--cream);border-radius:40px;box-shadow:0 30px 70px rgba(40,12,4,.5),inset 0 -6px 0 rgba(28,36,56,.08)}
/* mission-control "transmission" tab on top of every card */
.tx-tab{position:absolute;left:50%;top:-24px;transform:translateX(-50%);height:48px;padding:0 22px 0 14px;border-radius:24px;background:var(--navy);color:var(--cream);display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 8px 18px rgba(40,12,4,.35);white-space:nowrap;border:2px solid rgba(255,240,220,.18)}
.tx-dot{width:26px;height:26px;border-radius:50%;background:var(--sun);display:grid;place-items:center}
.tx-dot svg{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}

.btn{height:76px;border-radius:38px;border:0;display:inline-flex;align-items:center;justify-content:center;gap:12px;font-family:var(--display);font-weight:600;font-size:28px;padding:0 40px;transition:transform .12s ease, box-shadow .12s ease}
.btn-primary{background:linear-gradient(#e8793a,#c95a24);color:#fff9ee;box-shadow:0 6px 0 var(--orange-sh)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--orange-sh)}
.btn-primary:active{transform:translateY(4px);box-shadow:0 2px 0 var(--orange-sh)}
.btn-ghost{background:transparent;color:var(--navy);border:3px solid var(--navy);font-size:24px;height:72px;padding:0 30px}
.btn-ghost:hover{background:rgba(28,36,56,.07)}
.btn-ghost:active{transform:translateY(2px)}
.btn svg{flex:none}

.steps{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px;color:var(--ink-3)}
.steps .pips{display:flex;gap:8px}
.steps .pip{width:14px;height:14px;border-radius:7px;background:var(--cream-3);transition:width .35s ease, background .35s}
.steps .pip.on{width:40px;background:var(--orange)}
.steps .pip.done{background:var(--teal)}

.sol-pill{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px 0 8px;border-radius:20px;background:var(--sun);color:var(--navy);font-family:var(--display);font-weight:600;font-size:20px}
.sol-pill .ic{width:28px;height:28px;border-radius:50%;background:var(--navy);display:grid;place-items:center}
.sol-pill.alert{background:#ff8f6b}

/* =========================================================
   TEMPLATE A — MISSION INTRODUCTION
   ========================================================= */
#intro .card{width:1160px;height:680px;overflow:hidden}
.intro-track{position:absolute;inset:0;display:flex;width:200%;transition:transform .55s cubic-bezier(.65,0,.25,1)}
.intro-track.step2{transform:translateX(-50%)}
.intro-page{width:50%;height:100%;padding:56px 52px 40px;display:flex;flex-direction:column}
.intro-page[aria-hidden="true"]{visibility:hidden;transition:visibility 0s .55s}
.intro-page[aria-hidden="false"]{visibility:visible}

/* Sequence 1 — Briefing */
.brief{display:flex;gap:44px;flex:1;min-height:0}
.viewport{position:relative;flex:none;width:520px;border-radius:32px;overflow:hidden;box-shadow:inset 0 0 0 5px rgba(28,36,56,.9), 0 10px 0 rgba(28,36,56,.12)}
.viewport .scene{position:absolute;inset:0}
.vp-label{position:absolute;left:18px;top:16px;height:34px;padding:0 14px 0 10px;border-radius:17px;background:rgba(22,28,44,.85);color:var(--cream);display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;z-index:3}
.vp-label i{width:10px;height:10px;border-radius:50%;background:#ff6b5b;box-shadow:0 0 0 3px rgba(255,107,91,.3);animation:blink 1.2s infinite}
.brackets{position:absolute;inset:14px;pointer-events:none;z-index:2}
.brackets span{position:absolute;width:34px;height:34px;border:4px solid rgba(255,244,226,.85)}
.brackets span:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.brackets span:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
.brackets span:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 12px}
.brackets span:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 12px 0}
.brief-text{flex:1;display:flex;flex-direction:column;min-width:0}
.brief-text h1{margin:18px 0 0;font-family:var(--display);font-weight:700;font-size:54px;line-height:1.02;letter-spacing:-.01em}
.brief-text p{margin:18px 0 0;font-size:26px;font-weight:700;line-height:1.4;color:var(--ink-2)}
.objective{margin-top:24px;display:flex;align-items:center;gap:16px;padding:18px 22px;border-radius:26px;background:var(--navy);color:var(--cream);position:relative}
.objective .tgt{flex:none;width:62px;height:62px;border-radius:50%;background:var(--sun);display:grid;place-items:center}
.objective small{display:block;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--sun)}
.objective strong{display:block;font-family:var(--display);font-weight:600;font-size:30px;line-height:1.15;margin-top:2px}
.intro-foot{margin-top:auto;padding-top:24px;display:flex;align-items:center;gap:16px}
.intro-foot .spacer{flex:1}

/* Sequence 2 — How to play */
.howto-head{display:flex;align-items:center;gap:16px}
.howto-head h2{margin:0;font-family:var(--display);font-weight:700;font-size:50px;line-height:1}
.howto-head .mini{margin-left:auto;display:flex;align-items:center;gap:10px;height:44px;padding:0 18px 0 8px;border-radius:22px;background:var(--cream-2);font-family:var(--display);font-weight:600;font-size:18px;color:var(--ink-2)}
.howto-head .mini .ic{width:30px;height:30px;border-radius:50%;background:var(--navy);display:grid;place-items:center}
.ins-grid{margin-top:26px;display:grid;gap:18px;flex:1;min-height:0}
.ins{background:var(--cream-2);border-radius:28px;padding:14px 14px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.demo{position:relative;border-radius:20px;background:var(--navy);overflow:hidden;height:190px;flex:none}
.demo svg{display:block}
.ins-txt{display:flex;gap:12px;align-items:flex-start;padding:0 6px}
.ins-num{flex:none;width:40px;height:40px;border-radius:50%;background:var(--orange);color:#fff9ee;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:22px;box-shadow:0 3px 0 var(--orange-sh)}
.ins-txt b{display:block;font-family:var(--display);font-weight:600;font-size:26px;line-height:1.1}
.ins-txt div > span{display:block;margin-top:4px;font-weight:700;font-size:18px;line-height:1.3;color:var(--ink-2)}
.ins-grid.n2 .demo{height:230px}
.ins-grid.n4 .demo{height:160px}
.ins-grid.n4 .ins-txt b{font-size:23px}
.ins-grid.n4 .ins-txt span{font-size:17px}
.rules{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap}
.rule{display:flex;align-items:center;gap:10px;height:50px;padding:0 18px 0 6px;border-radius:25px;background:#fbe7b3;border:2px solid #efcf7d;font-weight:800;font-size:18px;color:#3d3220}
.rule .ic{width:38px;height:38px;border-radius:50%;background:var(--navy);display:grid;place-items:center;flex:none}
.rules-label{display:flex;align-items:center;height:50px;font-family:var(--display);font-weight:600;font-size:18px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin-right:2px}

/* =========================================================
   TEMPLATE B — MISSION ACCOMPLISHED
   ========================================================= */
#done{top:53%}
#done .card{width:800px;padding:122px 48px 34px;text-align:center}
.badge-wrap{position:absolute;left:50%;top:-92px;width:220px;height:220px;transform:translateX(-50%) scale(.86);transform-origin:50% 30%}
.burst{position:absolute;inset:-40px;border-radius:50%;background:repeating-conic-gradient(rgba(242,193,78,.55) 0 10deg,transparent 10deg 24deg);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:spin 18s linear infinite;opacity:0;transition:opacity .6s .3s}
.pop.on .burst{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.badge{position:absolute;left:30px;top:20px;width:160px;height:190px}
.pop.on .badge{animation:badgeIn .7s var(--ease-pop) .15s both}
@keyframes badgeIn{0%{transform:scale(.2) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
.badge .rib{position:absolute;top:0;width:40px;height:84px}
.badge .disc{position:absolute;left:10px;top:42px;width:140px;height:140px;border-radius:50%;background:var(--sun);border:7px solid var(--navy);display:grid;place-items:center;box-shadow:0 12px 22px rgba(40,12,4,.35),inset 0 -8px 0 rgba(170,110,20,.35)}
.badge .disc::after{content:"";position:absolute;inset:10px;border-radius:50%;border:3px dashed rgba(28,36,56,.35)}
.badge .check{position:absolute;right:-6px;bottom:4px;width:52px;height:52px;border-radius:50%;background:var(--teal);border:5px solid var(--cream);display:grid;place-items:center;box-shadow:0 4px 0 var(--teal-sh)}
.pop.on .badge .check{animation:pop .45s var(--ease-pop) .7s both}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}

.done-h{margin:0;font-family:var(--display);font-weight:700;font-size:50px;white-space:nowrap;line-height:1;letter-spacing:.01em;text-transform:uppercase;color:var(--navy)}
.done-h .ex{color:var(--orange)}
.done-name{margin:14px auto 0;display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 20px 0 8px;border-radius:23px;background:var(--cream-2);font-family:var(--display);font-weight:600;font-size:23px}
.done-name .ic{width:32px;height:32px;border-radius:50%;background:var(--navy);display:grid;place-items:center}
.done-fb{margin:12px auto 0;max-width:600px;font-weight:700;font-size:26px;line-height:1.4;color:var(--ink-2)}
.outcome{margin-top:20px;display:flex;align-items:center;gap:18px;padding:16px 24px 16px 16px;border-radius:26px;background:var(--navy);color:var(--cream);text-align:left}
.outcome .art{flex:none;width:92px;height:92px;border-radius:22px;overflow:hidden;position:relative}
.outcome b{display:block;font-family:var(--display);font-weight:600;font-size:25px;line-height:1.15}
.outcome span{display:block;margin-top:4px;font-weight:700;font-size:18px;line-height:1.35;color:#e8d9bf}
.outcome em{font-style:normal;color:var(--sun)}

.results{margin-top:16px;display:grid;gap:12px}
.metric{padding:12px 10px 12px;border-radius:24px;background:var(--cream-2);display:flex;flex-direction:column;align-items:center;gap:2px;opacity:0;transform:translateY(12px)}
.pop.on .metric{animation:rise .45s ease-out both}
@keyframes rise{to{opacity:1;transform:none}}
.metric .ic{width:46px;height:46px;border-radius:50%;background:var(--navy);display:grid;place-items:center;margin-bottom:4px}
.metric .val{font-family:var(--display);font-weight:700;font-size:42px;line-height:1.05}
.metric .val small{font-size:24px;font-weight:600;margin-left:3px}
.metric .lbl{font-weight:800;font-size:17px;color:var(--ink-3)}

.record{margin-top:16px;display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
.rec-box{position:relative;border-radius:24px;padding:22px 18px 16px;display:flex;align-items:center;gap:14px;text-align:left;background:var(--cream-2);opacity:0;transform:translateY(12px)}
.pop.on .rec-box{animation:rise .45s ease-out both}
.rec-box .ic{flex:none;width:56px;height:56px;border-radius:50%;background:var(--navy);display:grid;place-items:center}
.rec-box .lbl{font-weight:800;font-size:17px;color:var(--ink-3)}
.rec-box .val{font-family:var(--display);font-weight:700;font-size:46px;line-height:1}
.rec-box .val small{font-size:24px;font-weight:600;margin-left:3px}
.rec-box .sub{font-weight:700;font-size:15px;color:var(--ink-3);margin-top:2px}
.rec-box.now.isnew{background:#fde7a8;box-shadow:inset 0 0 0 3px var(--sun)}
.ribbon{position:absolute;right:14px;top:-24px;height:44px;padding:0 16px 0 10px;border-radius:22px;background:var(--orange);color:#fff9ee;display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 4px 0 var(--orange-sh);transform:rotate(6deg)}
.pop.on .ribbon{animation:stamp .55s var(--ease-pop) 1.15s both}
@keyframes stamp{0%{transform:rotate(-20deg) scale(2.2);opacity:0}100%{transform:rotate(6deg) scale(1);opacity:1}}
.rec-note{grid-column:1/-1;font-weight:700;font-size:17px;color:var(--ink-3);text-align:center;margin-top:2px}

.done-btns{margin-top:22px;display:flex;justify-content:center;gap:14px}
.done-btns .btn-primary{min-width:300px}

/* particles */
.fx{position:absolute;inset:0;pointer-events:none;overflow:visible}
.pt{position:absolute;left:50%;top:0;width:var(--s);height:var(--s);opacity:0}
.pop.on .pt,.fx.go .pt{animation:fly var(--d) cubic-bezier(.15,.7,.3,1) var(--dl) both}
@keyframes fly{0%{transform:translate(-50%,0) scale(.3) rotate(0);opacity:0}12%{opacity:1}100%{transform:translate(calc(-50% + var(--x)),var(--y)) scale(1) rotate(var(--r));opacity:0}}

/* =========================================================
   SHARED ILLUSTRATION & DEMO ANIMATIONS
   ========================================================= */
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.ring{animation:ring 1.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes ring{50%{transform:scale(.88);opacity:.55}}
.dash{stroke-dasharray:10 12;animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-22}}
.spin-s{animation:spin 2.4s linear infinite;transform-origin:center;transform-box:fill-box}
.wob{animation:wob .25s ease-in-out infinite alternate}
@keyframes wob{to{transform:rotate(4deg)}}

/* demo: drag a command block */
.d-drag .blk{animation:dragblk 3.2s ease-in-out infinite}
@keyframes dragblk{0%,12%{transform:translate(0,0)}45%,100%{transform:translate(118px,-74px)}}
.d-drag .slot{animation:slotfill 3.2s ease-in-out infinite}
@keyframes slotfill{0%,44%{opacity:1}46%,100%{opacity:0}}
/* demo: avoid rocks (path following) */
.mover{position:absolute;offset-rotate:auto 90deg;animation:follow var(--t,3.6s) ease-in-out infinite}
@keyframes follow{0%,8%{offset-distance:0%}85%,100%{offset-distance:100%}}
/* demo: press run */

   5. STATE
   ========================================================= */
const S = { mission:'soil', screen:'brief', variant:'B', newRecord:true };
const $ = id => document.getElementById(id);
const frame = $('frame');

/* =========================================================
   6. BACKGROUND GAMEPLAY SCENE (kept visible behind pop-ups)
   ========================================================= */

/* =========================================================
   7. TEMPLATE A — MISSION INTRODUCTION
   ========================================================= */
function tagPill(m){
  return m.tagType==='alert'
    ? `<span class="sol-pill alert"><span class="ic">${I.alert}</span>${m.tag}</span>`
    : `<span class="sol-pill"><span class="ic">${I.sol}</span>${m.tag}</span>`;
}
function stepsHTML(n){
  return `<div class="steps" aria-label="Step ${n} of 2"><span class="pips"><span class="pip ${n===1?'on':'done'}"></span><span class="pip ${n===2?'on':''}"></span></span>Step ${n} of 2</div>`;
}
function renderIntro(){
  const m = MISSIONS[S.mission];
  $('introTab').innerHTML = `<span class="tx-dot">${I.antenna}</span>${m.tagType==='alert'?'Emergency call':'New mission'}`;

  // Sequence 1 — Briefing
  $('briefPage').innerHTML = `
    <div class="brief">
      <div class="viewport" role="img" aria-label="Picture of the mission: ${m.title}">
        <div class="scene">${SCENES[m.scene]()}</div>
        <div class="brackets"><span></span><span></span><span></span><span></span></div>
        <div class="vp-label"><i></i>${m.camera||'Lander camera'}</div>
      </div>
      <div class="brief-text">
        <div>${tagPill(m)}</div>
        <h1 id="introTitle">${m.title}</h1>
        <p>${m.narrative}</p>
        <div class="objective">
          <span class="tgt">${I.tgt}</span>
          <div><small>Your mission</small><strong>${m.objective}</strong></div>
        </div>
        <div class="intro-foot">
          ${stepsHTML(1)}<span class="spacer"></span>
          <button class="btn btn-primary" data-act="next">Let’s go! ${I.arrowR}</button>
        </div>
      </div>
    </div>`;

  // Sequence 2 — How to Play (2–4 instructions, optional rules)
  const n = Math.max(1, Math.min(4, m.howTo.length));
  const cols = n === 4 ? 4 : n;
  $('howPage').innerHTML = `
    <div class="howto-head">
      <h2>How to Play</h2>
      <span class="mini"><span class="ic">${SOJO(24)}</span>${m.tag} · ${m.shortName}</span>
    </div>
    <div class="ins-grid n${n}" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">
      ${m.howTo.slice(0,4).map((s,i)=>`
        <div class="ins">
          <div class="demo" aria-hidden="true">${DEMOS[s.demo](s)}</div>
          <div class="ins-txt"><span class="ins-num">${i+1}</span><div><b>${s.title}</b><span>${s.text}</span></div></div>
        </div>`).join('')}
    </div>
    ${m.rules && m.rules.length ? `<div class="rules"><span class="rules-label">Remember</span>${m.rules.map(r=>`<span class="rule"><span class="ic">${I[r.icon]||''}</span>${r.text}</span>`).join('')}</div>` : ''}
    <div class="intro-foot">
      <button class="btn btn-ghost" data-act="back">${I.arrowL} Back</button>
      ${stepsHTML(2)}<span class="spacer"></span>
      <button class="btn btn-primary" data-act="start">${I.play} Start Mission</button>
    </div>`;
}

/* =========================================================
   8. TEMPLATE B — MISSION ACCOMPLISHED (A / B / C variations)
   ========================================================= */
function fmt(v, unit){ return `<span data-count="${v}">${v}</span>${unit?`<small>${unit}</small>`:''}`; }
function renderDone(){
  const m = MISSIONS[S.mission], c = m.complete, v = S.variant;
  let results = '';

  if (v === 'B' && m.metrics && m.metrics.length){
    const ms = m.metrics.slice(0,3);  // never more than three
    results = `<div class="results" style="grid-template-columns:repeat(${ms.length},minmax(0,1fr))">
      ${ms.map((x,i)=>`<div class="metric" style="animation-delay:${.55+i*.12}s">
        <span class="ic">${I[x.icon]||''}</span>
        <span class="val">${x.text ? x.text : fmt(x.value,x.unit)}</span>
        <span class="lbl">${x.label}</span></div>`).join('')}
    </div>`;
  }

  if (v === 'C' && m.record){
    const r = m.record, isNew = S.newRecord;
    const cur = isNew ? r.current : r.notBest;
    const best = r.best;
    const shownBest = isNew ? cur : best;
    results = `<div class="record">
      <div class="rec-box now ${isNew?'isnew':''}" style="animation-delay:.55s">
        ${isNew?`<span class="ribbon">${I.star} New record!</span>`:''}
        <span class="ic">${I[r.icon]||''}</span>
        <div><div class="lbl">This time</div><div class="val">${fmt(cur,r.unit)}</div><div class="sub">${r.label}</div></div>
      </div>
      <div class="rec-box" style="animation-delay:.7s">
        <span class="ic">${I.trophy}</span>
        <div><div class="lbl">Your best</div><div class="val">${shownBest}${r.unit?`<small>${r.unit}</small>`:''}</div>
        ${isNew?`<div class="sub">Before: ${best}${r.unit?' '+r.unit:''}</div>`:''}</div>
      </div>
      <div class="rec-note">${isNew ? 'You beat your best!' : 'Play again to try for a new best!'}</div>
    </div>`;
  }

  const showReplay = m.replayable && v !== 'A';
  $('doneCard').innerHTML = `
    <div class="badge-wrap" aria-hidden="true">
      <div class="burst"></div>
      <div class="badge">
        <div class="rib" style="left:36px;background:#3fb8a9;transform:skewX(14deg)"></div>
        <div class="rib" style="left:84px;background:#e8793a;transform:skewX(-14deg)"></div>
        <div class="disc">${SOJO(84)}</div>
        <div class="check">${I.check}</div>
      </div>
    </div>
    <div class="fx" id="fx"></div>
    <h2 class="done-h" id="doneTitle">Mission accomplished<span class="ex">!</span></h2>
    <div><span class="done-name"><span class="ic">${I.flag}</span>${c.title}</span></div>
    <p class="done-fb">${c.feedback}</p>
    <div class="outcome">
      <div class="art">${OUTCOME_ART[c.art]||''}</div>
      <div><b>${c.outcomeTitle}</b>${c.outcomeText?`<span>${c.outcomeText}</span>`:''}</div>
    </div>
    ${results}
    <div class="done-btns">
      ${showReplay?`<button class="btn btn-ghost" data-act="replay">${I.replay} Play Again</button>`:''}
      <button class="btn btn-primary" data-act="continue">Continue ${I.arrowR}</button>
    </div>`;
  spawnParticles($('fx'), v==='C' && S.newRecord);
}

/* particles: stars + confetti; extra wave for a new record */
function spawnParticles(el, extra){
  const cols = ['#f2c14e','#e8793a','#7fd6cc','#fff4e2','#3fb8a9'];
  const make = (n, delay, spread, originY) => {
    let h='';
    for(let i=0;i<n;i++){
      const a = (Math.PI*2*i/n) + Math.random()*.5;
      const d = spread*(.6+Math.random()*.6);
      const x = Math.cos(a)*d, y = Math.sin(a)*d*.75 + 60;
      const s = 10+Math.random()*14, star = Math.random()<.45;
      const col = cols[i%cols.length];
      const shape = star
        ? `<svg width="100%" height="100%" viewBox="0 0 24 24"><path d="M12 2.2l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17l-5.9 3.3 1.3-6.6L2.5 9.1l6.6-.8z" fill="${col}"/></svg>`
        : `<span style="display:block;width:100%;height:60%;border-radius:3px;background:${col}"></span>`;
      h += `<span class="pt" style="top:${originY}px;--s:${s}px;--x:${x}px;--y:${y}px;--r:${Math.round(Math.random()*540-270)}deg;--d:${(1.1+Math.random()*.6).toFixed(2)}s;--dl:${(delay+Math.random()*.15).toFixed(2)}s">${shape}</span>`;
    }
    return h;
  };
  el.innerHTML = make(26,.25,380,-20) + (extra ? make(30,1.15,300,250) : '');
}

/* count-up for numbers */
function countUp(){
  const reduce = document.body.classList.contains('rm') || matchMedia('(prefers-reduced-motion: reduce)').matches;
  frame.querySelectorAll('#done [data-count]').forEach((el,i)=>{
    const end = +el.dataset.count; if (isNaN(end)) return;
    if (reduce){ el.textContent = end; return; }
    const t0 = performance.now() + 550 + i*120, dur = 900;
    el.textContent = 0;
    const tick = now => {
      const p = Math.min(1, Math.max(0,(now-t0)/dur));
      el.textContent = Math.round(end*(1-Math.pow(1-p,3)));
      if (p<1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

/* Popup-only controller: no background, gameplay HUD, or preview controls. */
function show(screen, opts={}) {
  S.screen = screen;
  const intro=$('intro'), done=$('done');
  const introOn=screen==='brief'||screen==='howto';
  const doneOn=screen==='done';
  if(introOn && (opts.rerender || !intro.classList.contains('on'))) renderIntro();
  if(doneOn) renderDone();
  if(opts.replay){[intro,done].forEach(p=>p.classList.remove('on')); void frame.offsetWidth;}
  intro.classList.toggle('on',introOn);
  done.classList.toggle('on',doneOn);
  $('introTrack').classList.toggle('step2',screen==='howto');
  $('briefPage').setAttribute('aria-hidden',String(screen==='howto'));
  $('howPage').setAttribute('aria-hidden',String(screen!=='howto'));
  if(doneOn) countUp();
}
frame.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const a=b.dataset.act;
  if(a==='next')show('howto');
  if(a==='back')show('brief');
  if(a==='start'||a==='replay'||a==='continue'){
    show('hidden');
    window.parent?.postMessage({type:'sojo-popup-action',action:a,mission:S.mission},'*');
  }
});
function fit(){
  const W=window.innerWidth, H=window.innerHeight;
  const k=Math.min(W/1440,H/900);
  frame.style.transform=`scale(${k})`;
  $('frameWrap').style.width=1440*k+'px';
  $('frameWrap').style.height=900*k+'px';
}
addEventListener('resize',fit);
const params=new URLSearchParams(location.search);
const view=params.get('view')||'brief';
S.variant=({completion:'A',results:'B',record:'C'})[view]||S.variant;
S.newRecord=params.get('newRecord')!=='false';
fit();
show(['brief','howto','done'].includes(view)?view:['completion','results','record'].includes(view)?'done':'brief',{rerender:true});
window.addEventListener('message',e=>{
  if(e.data?.type==='sojo-show-popup'){
    if(e.data.variant)S.variant=e.data.variant;
    show(e.data.view||'brief',{rerender:true,replay:true});
  }
});
</script>
</body>
</html>
